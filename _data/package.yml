name: SmallClassNr
version: "1.6.0"
license: "GPL-2.0-or-later"
date: 2026-07-29
description: |
    Library of finite groups with small class number

authors:
    - name: Sam Tertooy
      url: https://stertooy.github.io/

maintainers:
    - name: Sam Tertooy
      url: https://stertooy.github.io/

GAP: ">= 4.14"

suggested-pkgs:
    - name: "smallgrp"
      version: "1.5.4"
      url: "https://gap-packages.github.io/smallgrp/"

www: https://stertooy.github.io/SmallClassNr
readme: README.md
packageinfo: https://stertooy.github.io/SmallClassNr/PackageInfo.g

downloads:
    - name: .tar.gz
      url: https://github.com/stertooy/SmallClassNr/releases/download/v1.6.0/SmallClassNr-1.6.0.tar.gz

abstract: |
    
        The SmallClassNr package provides access to finite groups with small class
        number. Currently, the package contains all finite groups of class number
        at most 14, and most finite groups with class numbers 15 to 20.

doc-html: doc/chap0_mj.html
doc-pdf: doc/manual.pdf
